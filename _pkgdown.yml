      - visualization

  - title: "Seurat Integration"
    desc: Functions for Seurat object compatibility
    contents:
      - AddClusterReliability
      - GetExpressionMatrix
      - PlotConfusionLinks
      - seurat_integration

  - title: "Utilities"
    desc: Helper functions
    contents:
