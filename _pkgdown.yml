      - train_test_split_stratified
      - make_unique_names
      - get_top_markers
      - utils

  - title: "S3 Methods"
    desc: Print and summary methods
    contents:
      - print.scClustEval
      - print.scClustEval_optim
      - summary.scClustEval
      - summary.scClustEval_optim

  - title: "Package Documentation"
    desc: Package overview
